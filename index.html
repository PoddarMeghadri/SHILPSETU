    <style>
      .grecaptcha-badge {
        visibility: hidden !important;
        opacity: 0 !important;
        pointer-events: none !important;
      }
    </style>
    <script>
      (function() {
        try {
          var savedTheme = localStorage.getItem('shilpsetu_theme');
          var isAdmin = localStorage.getItem('shilpsetu_admin_mode') === 'true';
          if (savedTheme === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
          if (isAdmin) {
            document.documentElement.classList.add('admin-mode');
          }
        } catch (e) {}
      })();
    </script>

  <body class="bg-[#F4ECDE] dark:bg-[#121411] text-[#1A1815] dark:text-[#F4ECDE] antialiased select-none font-sans overflow-x-hidden transition-colors duration-250">
    <div id="root"></div>
    <div id="recaptcha-container" aria-hidden="true"></div>
    <div id="clerk-captcha" class="empty:hidden flex justify-center my-2"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js').then(function(reg) {
            console.log('[ShilpSetu PWA] Service worker active with scope:', reg.scope);
          }).catch(function(err) {
            console.warn('[ShilpSetu PWA] Service worker registration notice:', err);
          });
        });
      }
    </script>
  </body>
